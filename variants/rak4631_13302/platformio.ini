[rak4631_13302]
extends = nrf52_base
board = rak4631_13302
board_check = true
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/rak4631_13302
  -D RAK_4631_13302
  ; Do not define RAK_BOARD here: the RAK WisBlock GPS auto-detection probes
  ; WB_IO2/WB_IO4/WB_IO5, which this variant reserves for the RAK13302 radio.
  ; -D RAK_BOARD
  -D NRF52_POWER_MANAGEMENT
  -D PIN_BOARD_SCL=14
  -D PIN_BOARD_SDA=13
  ; Disable inherited generic GPS support: Serial1 may be used by other modules,
  ; and this variant avoids RAK GPS auto-detection because WB_IO2/WB_IO4/WB_IO5
  ; are reserved for the RAK13302 radio.
  ; Leave GPS pins undefined unless GPS support is deliberately re-enabled with
  ; a reviewed pin assignment.
  ; -D PIN_GPS_TX=PIN_SERIAL1_RX
  ; -D PIN_GPS_RX=PIN_SERIAL1_TX
  ; -D PIN_GPS_EN=-1
  -UENV_INCLUDE_GPS
  ; Explicitly block RAK12035 soil moisture support for this variant. RAK12035
  ; uses WisBlock IO pins that are reserved here for the RAK13302 radio, so do
  ; not re-enable ENV_INCLUDE_RAK12035 without a hardware pin review.
  -UENV_INCLUDE_RAK12035
  -D ENV_INCLUDE_RAK12035=0
  -D PIN_OLED_RESET=-1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1       ; Patch register 0x8B5 for improved RX with SKY66122 FEM
  -D RAK_13302
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak4631_13302>
  +<helpers/sensors>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27

[env:RAK_4631_13302_repeater]
extends = rak4631_13302
build_flags =
  ${rak4631_13302.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK4631+RAK13302 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rak4631_13302.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>

[env:RAK_4631_13302_repeater_bridge_rs232_serial1]
extends = rak4631_13302
build_flags =
  ${rak4631_13302.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RS232 Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_RS232_BRIDGE=Serial1
  -D WITH_RS232_BRIDGE_RX=PIN_SERIAL1_RX
  -D WITH_RS232_BRIDGE_TX=PIN_SERIAL1_TX
;  -D BRIDGE_DEBUG=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
;  -D CORE_DEBUG_LEVEL=3
build_src_filter = ${rak4631_13302.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/bridges/RS232Bridge.cpp>
  +<../examples/simple_repeater>

